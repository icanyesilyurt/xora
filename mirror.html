<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Mirror — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
  <nav class="topnav">
    <a href="credits.html" class="pill credits-pill">⚡ <b id="creditVal">0</b></a>
    <a href="profile.html" class="pill" data-i18n="nav_profile">Profil</a>
    <button type="button" class="pill lang-btn" id="langBtn">EN</button>
  </nav>
</header>

<main class="page">
  <section id="inputView">
    <span class="mode-emoji">🪞</span>
    <h1 data-i18n="mirror_h1">X Mirror</h1>
    <p class="sub" data-i18n="mirror_sub">Kendi X karakterini görmek için X kullanıcı adını yaz.</p>

    <div class="tier-switch" role="tablist" aria-label="XORA modu">
      <a id="funTab" class="tier-tab" href="mirror.html?tier=fun">
        <strong data-i18n="tier_fun">Eğlence Kartı</strong><span data-i18n="badge_free">Ücretsiz</span>
      </a>
      <a id="realTab" class="tier-tab" href="mirror.html?tier=real" data-auth-required>
        <strong data-i18n="tier_real">Gerçek Analiz</strong><span data-i18n="badge_c5">5 Kredi</span>
      </a>
    </div>
    <p class="tier-note" id="tierNote"></p>

    <div class="handle-form">
      <input type="text" id="mirrorHandleInput" class="handle-input" data-i18n-ph="mirror_ph" placeholder="@kullaniciadi" maxlength="30" autocomplete="off" spellcheck="false">
      <button type="button" class="btn" id="goBtn">Başla</button>
    </div>
  </section>

  <section id="analyzingView" hidden>
    <div class="thinking">
      <div class="xora-face" aria-hidden="true"><span class="xora-eye"></span><span class="xora-eye"></span></div>
      <p class="think-msg" id="thinkMsg"></p>
      <div class="think-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>

  <section id="resultView" hidden>
    <div id="cardHolder"></div>
    <p class="tier-result-note" id="resultTierNote"></p>
    <div class="result-actions">
      <button type="button" class="btn btn-orange" id="dlBtn" data-i18n="btn_download">Kartı İndir</button>
      <button type="button" class="btn" id="shareBtn" data-i18n="btn_share">X'te Paylaş</button>
      <button type="button" class="btn btn-ghost" id="rerollBtn" data-i18n="reroll_btn">Tekrar Çek</button>
    </div>
    <p class="upsell"><span data-i18n="upsell_mirror">Peki ya o kişi? 👀</span> <a href="stalk.html?tier=fun" data-i18n="upsell_mirror_btn">X Stalk ile bak</a></p>
  </section>
</main>

<footer class="foot">XORA V2</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="xora.js"></script>
<script src="card.js"></script>
<script>
(function () {
  var tier = getTierFromUrl();
  var lastResult = null;
  var lastHandle = "";
  var reroll = 0;
  var state = "input";
  var inputView = document.getElementById("inputView");
  var analyzingView = document.getElementById("analyzingView");
  var resultView = document.getElementById("resultView");
  var handleInput = document.getElementById("mirrorHandleInput");
  var goBtn = document.getElementById("goBtn");

  function setState(next) {
    state = next;
    inputView.hidden = next !== "input";
    analyzingView.hidden = next !== "analyzing";
    resultView.hidden = next !== "result";
  }

  function renderTierUi() {
    document.getElementById("funTab").classList.toggle("active", tier === "fun");
    document.getElementById("realTab").classList.toggle("active", tier === "real");
    document.getElementById("tierNote").textContent = tier === "real" ? t("real_explainer") : t("fun_explainer");
    document.getElementById("resultTierNote").textContent = tier === "real" ? t("real_explainer") : t("fun_explainer");
    goBtn.textContent = tier === "real" ? t("real_btn_5") : t("fun_btn");
    document.getElementById("rerollBtn").hidden = tier !== "fun";
  }

  function showResult() {
    document.getElementById("cardHolder").innerHTML = buildIdentityCard(lastResult);
    setState("result");
    renderTierUi();
    applyI18n();
  }

  async function start() {
    if (state === "analyzing") return;
    var handle = /^@?[a-zA-Z0-9_]{1,15}$/.test(handleInput.value.trim()) ? normHandle(handleInput.value) : "";
    if (!handle) { toast(t("toast_handle")); handleInput.focus(); return; }
    lastHandle = handle;

    if (tier === "real" && !isLoggedIn()) {
      window.location.href = "auth.html";
      return;
    }

    if (tier === "fun") {
      lastResult = markAnalysisTier(analyzeFunHandle(handle, "mirror", reroll), "fun", "mirror");
      if (isLoggedIn()) saveAnalysisRecord("mirror", [handle], lastResult);
      setState("analyzing");
      playThinking(document.getElementById("thinkMsg"), "mirror", showResult);
      return;
    }

    setState("analyzing");
    var stop = startThinkingLoop(document.getElementById("thinkMsg"), "mirror");
    try {
      lastResult = await requestRealAnalysis("mirror", { handle: handle });
      saveAnalysisLocalOnly("mirror", [handle], lastResult);
      stop();
      showResult();
    } catch (err) {
      stop();
      setState("input");
      toast(realErrorMessage(err));
      renderTierUi();
    }
  }

  goBtn.addEventListener("click", start);
  handleInput.addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
  document.getElementById("rerollBtn").addEventListener("click", function () {
    if (tier !== "fun" || !lastHandle) return;
    reroll += 1;
    handleInput.value = "@" + lastHandle;
    start();
  });
  document.getElementById("dlBtn").addEventListener("click", function () {
    if (lastResult) downloadCanvas(renderIdentityPNG(lastResult), "xora-" + tier + "-mirror-" + lastResult.handle + ".png");
  });
  document.getElementById("shareBtn").addEventListener("click", function () {
    if (lastResult) shareOnX(shareIdentityText(lastResult));
  });
  document.addEventListener("xora:lang", function () {
    renderTierUi();
    if (lastResult && state === "result") showResult();
  });

  (async function init() {
    await initSession();
    renderTierUi();
    if (tier === "real" && !isLoggedIn()) {
      window.location.href = "auth.html";
      return;
    }
    var user = getUser();
    if (user && tier === "real") handleInput.value = "@" + user;
    setState("input");
  })();
})();
</script>
</body>
</html>
