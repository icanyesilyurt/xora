<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ad-form{display:grid;gap:10px;margin-top:10px}
.ad-form label{font-weight:800;font-size:13px;color:var(--mut)}
.ad-form input{width:100%;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;font:800 15px Nunito,sans-serif;background:#fff;color:var(--ink);box-sizing:border-box}
.ad-row{display:grid;grid-template-columns:1fr 110px;gap:10px}
.ad-p{border:2.5px solid var(--ink);border-radius:18px;padding:14px;background:#fff;margin-top:12px}
.ad-p.off{opacity:.55}
.ad-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ad-head b{font-size:18px;font-weight:900}
.ad-head span{color:var(--mut);font-weight:800;font-size:13px}
.ad-nums{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-weight:800;font-size:14px}
.ad-nums em{font-style:normal;color:var(--mut);font-weight:700}
.ad-link{display:flex;gap:6px;align-items:center;margin-top:8px}
.ad-link small{width:62px;flex:none;color:var(--mut);font-weight:800;font-size:12px}
.ad-link input{flex:1;min-width:0;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;font:700 12px Nunito,sans-serif;background:#FFF8EF;color:var(--ink)}
.ad-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ad-acts .btn{font-size:12px;padding:7px 12px}
.ad-msg{color:var(--mut);font-weight:700;margin-top:8px}
.st-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.st-tabs button{padding:7px 14px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font:900 13px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.st-tabs button.on{background:var(--ink);color:#fff}
.st-group{font-weight:900;font-size:12px;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px;text-transform:uppercase}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.st{border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fff}
.st small{display:block;color:var(--mut);font-weight:800;font-size:12px}
.st b{display:block;font-size:22px;font-weight:900;margin-top:2px;line-height:1.15}
.st i{display:block;font-style:normal;color:var(--mut);font-weight:700;font-size:11.5px;margin-top:2px}
.st.hl{background:#E6F7F6}
.st-days{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
.st-days th{text-align:end;color:var(--mut);font-size:11.5px;font-weight:800;padding:5px 4px;border-bottom:2px solid var(--ink)}
.st-days td{text-align:end;padding:6px 4px;border-bottom:1px solid rgba(0,0,0,.08);font-weight:800}
.st-days th:first-child,.st-days td:first-child{text-align:start}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
</header>

<main class="page">
  <span class="mode-emoji">🛠️</span>
  <h1>Yönetim</h1>
  <p class="sub">Genel durum, partnerler ve kazançları.</p>
  <div id="adStats"></div>
  <div id="adBody"><p class="ad-msg">Yükleniyor…</p></div>
</main>

<footer class="foot">XORA V2</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  // Owner-only page. The server refuses every call from accounts that are not in xora_admins.
  var body = document.getElementById("adBody");
  var sb = typeof getSupabaseClient === "function" ? getSupabaseClient() : null;
  var siteUrl = typeof getSiteRoot === "function" ? getSiteRoot() : location.origin + "/";
  var panelBase = siteUrl.replace(/\/+$/, "") + "/partner?key=";

  function msg(text) { body.innerHTML = '<p class="ad-msg">' + esc(text) + '</p>'; }
  function money(v, cur) {
    var n = Number(v || 0);
    return cur === "USD" ? new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n)
      : new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 }).format(n) + " ₺";
  }
  // "Kartal Hesabı" -> "kartal-hesabi"
  function slug(name) {
    var map = { "ç": "c", "ğ": "g", "ı": "i", "İ": "i", "ö": "o", "ş": "s", "ü": "u", "Ç": "c", "Ğ": "g", "Ö": "o", "Ş": "s", "Ü": "u" };
    return String(name || "").replace(/[çğıİöşüÇĞÖŞÜ]/g, function (c) { return map[c]; }).toLowerCase()
      .replace(/^@+/, "").replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  }
  function copyField(btn) {
    var input = btn.parentNode.querySelector("input");
    var done = function () { var t = btn.textContent; btn.textContent = "Kopyalandı"; setTimeout(function () { btn.textContent = t; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done, function () { input.select(); });
    else { input.select(); try { document.execCommand("copy"); done(); } catch (e) {} }
  }
  async function call(fn, args) {
    var res = await sb.rpc(fn, args || {});
    if (res.error) throw new Error(/not_admin/.test(res.error.message) ? "not_admin" : res.error.message);
    return res.data;
  }

  // ---- Genel durum ----
  var statsEl = document.getElementById("adStats"), statsDays = 30;
  function num(n) { return new Intl.NumberFormat("tr-TR").format(Number(n || 0)); }
  function pct(a, b) { return b > 0 ? "%" + Math.round(a / b * 1000) / 10 : "–"; }
  function tile(label, value, note, hl) {
    return '<div class="st' + (hl ? ' hl' : '') + '"><small>' + esc(label) + '</small><b>' + esc(value) + '</b>' + (note ? '<i>' + esc(note) + '</i>' : '') + '</div>';
  }
  function moneyList(obj) {
    var keys = Object.keys(obj || {}).sort();
    return keys.length ? keys.map(function (c) { return money(obj[c], c); }).join(" + ") : money(0, "TRY");
  }
  async function renderStats() {
    var tabs = [[1, "Bugün"], [7, "7 gün"], [30, "30 gün"], [0, "Tümü"]];
    var head = '<div class="panel"><p style="font-weight:900">Genel durum</p><div class="st-tabs">' +
      tabs.map(function (t) { return '<button type="button" data-days="' + t[0] + '"' + (t[0] === statsDays ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join("") + '</div>';
    statsEl.innerHTML = head + '<p class="ad-msg">Yükleniyor…</p></div>';
    var s;
    try { s = await call("xora_admin_stats", { p_days: statsDays }); }
    catch (e) { statsEl.innerHTML = head + '<p class="ad-msg">Rakamlar alınamadı. (İstatistik güncellemesi veritabanına henüz eklenmemiş olabilir.)</p></div>'; return; }
    var real = s.real_by_mode || {};
    var html = head +
      '<p class="st-group">Trafik</p><div class="st-grid">' +
        tile("Ziyaretçi", num(s.visitors), num(s.page_views) + " sayfa görüntüleme") +
        tile("Partner linkinden", num(s.ref_visitors), pct(s.ref_visitors, s.visitors) + " ziyaretçi") +
        tile("Yeni üye", num(s.signups), "Toplam " + num(s.users_total) + " · dönüşüm " + pct(s.signups, s.visitors)) +
      '</div><p class="st-group">Kartlar</p><div class="st-grid">' +
        tile("Fun kart", num(s.fun_cards), "Ücretsiz") +
        tile("Real analiz", num(s.real_cards), "Mirror " + num(real.mirror) + " · Stalk " + num(real.stalk) + " · Match " + num(real.match)) +
        tile("Başarısız Real", num(s.real_failed), "Kredisi otomatik iade") +
        tile("X'te paylaşılan", s.shared_cards == null ? "–" : num(s.shared_cards), "Kart görseli") +
      '</div><p class="st-group">Satış</p><div class="st-grid">' +
        tile("Ciro", moneyList(s.revenue), num(s.sales) + " satış · " + num(s.buyers) + " alıcı", true) +
        tile("Satılan kredi", num(s.credits_sold), "Üyelerin " + pct(s.buyers, s.signups) + "'i aldı") +
        tile("Yarım kalan ödeme", num(s.checkouts_open), num(s.checkouts_failed) + " başarısız") +
      '</div><p class="st-group">Krediler</p><div class="st-grid">' +
        tile("Harcanan kredi", num(s.credits_spent), num(s.credits_refunded) + " iade edildi") +
        tile("Bekleyen kredi", num(s.credits_outstanding), "Hesaplarda duran (hediye dâhil)") +
        tile("Ödenecek komisyon", moneyList(s.commission_unpaid), num(s.partners_active) + " aktif partner") +
      '</div><p class="st-group">Son 14 gün</p><table class="st-days"><thead><tr><th>Gün</th><th>Ziyaretçi</th><th>Üye</th><th>Fun</th><th>Real</th><th>Satış</th></tr></thead><tbody>' +
        (s.daily || []).map(function (d) {
          var day = new Date(d.day + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "short", weekday: "short" });
          return '<tr><td>' + esc(day) + '</td><td>' + num(d.visitors) + '</td><td>' + num(d.signups) + '</td><td>' + num(d.fun_cards) + '</td><td>' + num(d.real_cards) + '</td><td>' + num(d.sales) + '</td></tr>';
        }).join("") +
      '</tbody></table><p class="ad-msg" style="font-size:12px">Ziyaret ve Fun kart sayımı bu güncellemeyle başladı; öncesi görünmez.</p></div>';
    statsEl.innerHTML = html;
  }
  statsEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-days]") : null;
    if (!b) return;
    statsDays = Number(b.getAttribute("data-days"));
    renderStats();
  });

  function partnerHtml(p) {
    var nums = '<span><em>Gelen</em> ' + esc(p.signups) + '</span><span><em>Satış</em> ' + esc(p.sales) + '</span><span><em>Oran</em> %' + esc(Math.round(p.commission_bps / 100)) + '</span>';
    var pays = "";
    (p.totals || []).forEach(function (t) {
      nums += '<span><em>Ciro ' + esc(t.currency) + '</em> ' + esc(money(t.revenue, t.currency)) + '</span><span><em>Bekleyen ' + esc(t.currency) + '</em> ' + esc(money(t.unpaid, t.currency)) + '</span>';
      if (Number(t.unpaid) > 0) pays += '<button type="button" class="btn btn-sm btn-orange" data-act="paid" data-cur="' + esc(t.currency) + '">Ödendi işaretle · ' + esc(money(t.unpaid, t.currency)) + '</button>';
    });
    return '<div class="ad-p' + (p.is_active ? '' : ' off') + '" data-code="' + esc(p.code) + '" data-name="' + esc(p.display_name || "") + '" data-bps="' + esc(p.commission_bps) + '">' +
      '<div class="ad-head"><b>' + esc(p.display_name || p.code) + '</b><span>' + esc(p.code) + (p.is_active ? '' : ' · durduruldu') + '</span></div>' +
      '<div class="ad-nums">' + nums + '</div>' +
      '<div class="ad-link"><small>Paylaşım</small><input readonly value="' + esc(siteUrl + "?ref=" + encodeURIComponent(p.code)) + '"><button type="button" class="btn btn-sm" data-act="copy">Kopyala</button></div>' +
      '<div class="ad-link"><small>Panel (gizli)</small><input readonly value="' + esc(panelBase + p.panel_key) + '"><button type="button" class="btn btn-sm" data-act="copy">Kopyala</button></div>' +
      '<div class="ad-acts">' + pays +
        '<button type="button" class="btn btn-sm" data-act="rate">Oranı değiştir</button>' +
        '<button type="button" class="btn btn-sm" data-act="toggle">' + (p.is_active ? 'Durdur' : 'Yeniden başlat') + '</button>' +
        '<button type="button" class="btn btn-sm" data-act="rotate">Panel linkini yenile</button>' +
      '</div></div>';
  }

  async function render() {
    var list = await call("xora_admin_partners");
    body.innerHTML =
      '<div class="panel"><p style="font-weight:900">Yeni partner</p><form class="ad-form" id="adNew">' +
        '<div><label for="adName">Partner adı (ör. X hesabının adı)</label><input id="adName" required maxlength="80" placeholder="Kartal Hesabı"></div>' +
        '<div class="ad-row"><div><label for="adCode">Link kodu</label><input id="adCode" required maxlength="40" placeholder="kartal-hesabi"></div>' +
        '<div><label for="adRate">Komisyon %</label><input id="adRate" required type="number" min="0" max="100" step="1" value="25"></div></div>' +
        '<button type="submit" class="btn btn-orange">Partner oluştur</button><p class="ad-msg" id="adNewMsg"></p></form></div>' +
      '<div id="adList">' + (list.length ? list.map(partnerHtml).join("") : '<p class="ad-msg">Henüz partner yok.</p>') + '</div>';

    // Link codes are random by default (e.g. x7k2m9), so a partner link reveals neither the owner nor
    // the partner. A readable code can still be typed in by hand.
    var name = document.getElementById("adName"), code = document.getElementById("adCode");
    function randomCode() {
      var abc = "abcdefghjkmnpqrstuvwxyz23456789", out = "x", buf = new Uint32Array(5);
      crypto.getRandomValues(buf);
      for (var i = 0; i < buf.length; i++) out += abc[buf[i] % abc.length];
      return list.some(function (p) { return p.code === out; }) ? randomCode() : out;
    }
    code.value = randomCode();
    document.getElementById("adNew").addEventListener("submit", async function (e) {
      e.preventDefault();
      var out = document.getElementById("adNewMsg");
      if (!code.value.trim()) code.value = randomCode();
      var c = slug(code.value), rate = Math.round(Number(document.getElementById("adRate").value));
      if (!/^[a-z0-9_-]{2,40}$/.test(c)) { out.textContent = "Link kodu en az 2 karakter olmalı (harf, rakam, - ve _)."; return; }
      if (list.some(function (p) { return p.code === c; })) { out.textContent = "Bu link kodu zaten kullanılıyor."; return; }
      if (!(rate >= 0 && rate <= 100)) { out.textContent = "Komisyon 0 ile 100 arasında olmalı."; return; }
      out.textContent = "Oluşturuluyor…";
      try { await call("xora_admin_save_partner", { p_code: c, p_display_name: name.value.trim(), p_commission_bps: rate * 100, p_is_active: true }); await render(); }
      catch (err) { out.textContent = "Oluşturulamadı: " + err.message; }
    });

    document.getElementById("adList").addEventListener("click", async function (e) {
      var btn = e.target.closest("[data-act]"); if (!btn) return;
      var card = btn.closest(".ad-p"), c = card.getAttribute("data-code"), act = btn.getAttribute("data-act");
      if (act === "copy") { copyField(btn); return; }
      try {
        if (act === "paid") {
          if (!window.confirm(c + " için bekleyen " + btn.getAttribute("data-cur") + " komisyonu ödendi olarak işaretlensin mi?")) return;
          await call("xora_admin_mark_commissions_paid", { p_code: c, p_currency: btn.getAttribute("data-cur") });
        } else if (act === "rate") {
          var v = window.prompt("Yeni komisyon oranı (%)", String(Number(card.getAttribute("data-bps")) / 100));
          if (v === null) return;
          var r = Math.round(Number(v)); if (!(r >= 0 && r <= 100)) { window.alert("0 ile 100 arasında bir sayı gir."); return; }
          await call("xora_admin_save_partner", { p_code: c, p_display_name: card.getAttribute("data-name"), p_commission_bps: r * 100, p_is_active: !card.classList.contains("off") });
        } else if (act === "toggle") {
          await call("xora_admin_save_partner", { p_code: c, p_display_name: card.getAttribute("data-name"), p_commission_bps: Number(card.getAttribute("data-bps")), p_is_active: card.classList.contains("off") });
        } else if (act === "rotate") {
          if (!window.confirm("Eski panel linki çalışmayı bırakacak. Yenisini partnere tekrar göndermen gerekir. Devam edilsin mi?")) return;
          await call("xora_admin_rotate_panel_key", { p_code: c });
        }
        await render();
      } catch (err) { window.alert("İşlem yapılamadı: " + err.message); }
    });
  }

  (async function start() {
    if (!sb) { msg("Bağlantı kurulamadı."); return; }
    var s = await sb.auth.getSession();
    if (!s || !s.data || !s.data.session) { body.innerHTML = '<p class="ad-msg">Önce XORA hesabınla giriş yap.</p><a class="btn btn-orange" href="auth.html">Giriş yap</a>'; return; }
    try {
      if (!(await call("xora_is_admin"))) { msg("Bu sayfa sadece site sahibi içindir."); return; }
      renderStats();
      await render();
    } catch (err) { msg(err.message === "not_admin" ? "Bu sayfa sadece site sahibi içindir." : "Bilgiler alınamadı: " + err.message); }
  })();
})();
</script>
</body>
</html>
