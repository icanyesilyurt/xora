<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Stalk — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
  <nav class="topnav">
    <a href="credits.html" class="pill credits-pill">⚡ <b id="creditVal">0</b></a>
    <a href="profile.html" class="pill" data-i18n="nav_profile">Profil</a>
    <button type="button" class="pill lang-btn" id="langBtn">EN</button>
  </nav>
</header>

<main class="page">
  <section id="step-input">
    <span class="mode-emoji">👀</span>
    <h1 data-i18n="stalk_h1">X Stalk</h1>
    <p class="sub" data-i18n="stalk_sub">Bir kullanıcı adı yaz, XORA gizlice baksın. Bu iş aramızda kalır.</p>

    <div class="tier-switch" role="tablist" aria-label="XORA modu">
      <a id="funTab" class="tier-tab" href="stalk.html?tier=fun"><strong data-i18n="tier_fun">Eğlence Kartı</strong><span data-i18n="badge_free">Ücretsiz</span></a>
      <a id="realTab" class="tier-tab" href="stalk.html?tier=real" data-auth-required><strong data-i18n="tier_real">Gerçek Analiz</strong><span data-i18n="badge_c5">5 Kredi</span></a>
    </div>
    <p class="tier-note" id="tierNote"></p>

    <div class="handle-form">
      <input type="text" id="handleInput" class="handle-input" data-i18n-ph="stalk_ph" placeholder="@merakettigin" maxlength="30" autocomplete="off" spellcheck="false">
      <button type="button" class="btn btn-orange" id="goBtn">Başla</button>
    </div>
  </section>

  <section id="step-think" hidden>
    <div class="thinking">
      <div class="xora-face" aria-hidden="true"><span class="xora-eye"></span><span class="xora-eye"></span></div>
      <p class="think-msg" id="thinkMsg"></p>
      <div class="think-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>

  <section id="step-result" hidden>
    <div id="cardHolder"></div>
    <p class="tier-result-note" id="resultTierNote"></p>
    <div class="result-actions">
      <button type="button" class="btn btn-orange" id="dlBtn" data-i18n="btn_download">Kartı İndir</button>
      <button type="button" class="btn" id="shareBtn" data-i18n="btn_share">X'te Paylaş</button>
      <button type="button" class="btn btn-ghost" id="rerollBtn" data-i18n="reroll_btn">Tekrar Çek</button>
      <a href="stalk.html?tier=fun" class="btn btn-ghost" id="againBtn" data-i18n="btn_again">Tekrar Dene</a>
    </div>
  </section>
</main>

<footer class="foot">XORA V2</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="xora.js"></script>
<script src="card.js"></script>
<script>
(function () {
  var tier = getTierFromUrl();
  var lastResult = null;
  var lastHandle = "";
  var reroll = 0;
  var stepInput = document.getElementById("step-input");
  var stepThink = document.getElementById("step-think");
  var stepResult = document.getElementById("step-result");
  var input = document.getElementById("handleInput");
  var goBtn = document.getElementById("goBtn");

  var currentState = "input";
  function setState(state) {
    currentState = state;
    stepInput.hidden = state !== "input";
    stepThink.hidden = state !== "think";
    stepResult.hidden = state !== "result";
  }
  function renderTierUi() {
    document.getElementById("funTab").classList.toggle("active", tier === "fun");
    document.getElementById("realTab").classList.toggle("active", tier === "real");
    document.getElementById("tierNote").textContent = tier === "real" ? t("real_explainer") : t("fun_explainer");
    document.getElementById("resultTierNote").textContent = tier === "real" ? t("real_explainer") : t("fun_explainer");
    goBtn.textContent = tier === "real" ? t("real_btn_5") : t("fun_btn");
    document.getElementById("rerollBtn").hidden = tier !== "fun";
    showProductionRealPause(tier);
    document.getElementById("againBtn").href = "stalk.html?tier=" + tier;
  }
  function showResult() {
    document.getElementById("cardHolder").innerHTML = buildIdentityCard(lastResult);
    setState("result");
    renderTierUi();
    applyI18n();
  }
  async function start() {
    if (showProductionRealPause(tier)) return;
    if (currentState === "think") return;
    var handle = /^@?[a-zA-Z0-9_]{1,15}$/.test(input.value.trim()) ? normHandle(input.value) : "";
    if (!handle) { toast(t("toast_handle")); input.focus(); return; }
    lastHandle = handle;
    if (tier === "real" && !isLoggedIn()) { window.location.href = "auth.html"; return; }

    if (tier === "fun") {
      lastResult = markAnalysisTier(analyzeFunHandle(handle, "stalk", reroll), "fun", "stalk");
      if (isLoggedIn()) saveAnalysisRecord("stalk", [handle], lastResult);
      setState("think");
      playThinking(document.getElementById("thinkMsg"), "stalk", showResult);
      return;
    }

    setState("think");
    var stop = startThinkingLoop(document.getElementById("thinkMsg"), "stalk");
    try {
      lastResult = await requestRealAnalysis("stalk", { handle: handle });
      saveAnalysisLocalOnly("stalk", [handle], lastResult);
      stop();
      showResult();
    } catch (err) {
      stop();
      setState("input");
      toast(realErrorMessage(err));
      renderTierUi();
    }
  }

  goBtn.addEventListener("click", start);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
  document.getElementById("rerollBtn").addEventListener("click", function () {
    if (tier !== "fun" || !lastHandle) return;
    reroll += 1;
    input.value = "@" + lastHandle;
    start();
  });
  document.getElementById("dlBtn").addEventListener("click", function () {
    if (lastResult) downloadCanvas(renderIdentityPNG(lastResult), "xora-" + tier + "-stalk-" + lastResult.handle + ".png");
  });
  document.getElementById("shareBtn").addEventListener("click", function () {
    if (lastResult) shareOnX(shareIdentityText(lastResult));
  });
  document.addEventListener("xora:lang", function () { renderTierUi(); if (lastResult && !stepResult.hidden) showResult(); });

  (async function init() {
    if (showProductionRealPause(tier)) { renderTierUi(); setState("input"); return; }
    await initSession();
    renderTierUi();
    if (tier === "real" && !isLoggedIn()) { window.location.href = "auth.html"; return; }
    setState("input");
  })();
})();
</script>
</body>
</html>
