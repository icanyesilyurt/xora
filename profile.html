<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
  <nav class="topnav">
    <a href="credits.html" class="pill credits-pill">⚡ <b id="creditVal">10</b></a>
    <a href="profile.html" class="pill" data-i18n="nav_profile">Profil</a>
    <button type="button" class="pill lang-btn" id="langBtn">EN</button>
  </nav>
</header>

<main class="page">
  <h1 data-i18n="profile_h1">Profil</h1>
  <p class="sub"></p>

  <!-- bağlı kullanıcı yoksa -->
  <section id="noUser" hidden>
    <div class="empty-box">
      <p data-i18n="profile_nouser">Devam etmek için giriş yapmalısın.</p>
      <a href="auth.html" class="btn" id="profileLoginBtn" data-i18n="profile_gomirror">Giriş Yap</a>
    </div>
  </section>

  <!-- bağlı kullanıcı varsa -->
  <section id="hasUser" hidden>

    <div class="panel">
      <div class="profile-row">
        <div class="profile-user">
          <img id="pAvatar" class="profile-avatar" alt="">
          <div>
          <p class="profile-name" id="pName">@kullanici</p>
          <p class="history-date" id="pHandle">@kullanici</p>
          <p class="history-date" data-i18n="profile_balance">Merak Kredisi</p>
          </div>
        </div>
        <p class="balance-big"><span id="pCredits">0</span> <small>⚡</small></p>
      </div>
    </div>

    <div class="panel" id="lastCardPanel">
      <h2 data-i18n="profile_last">Son Kartın</h2>
      <div id="lastCardHolder" style="text-align:center"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="profile_actions">Analiz Başlat</h2>
      <div class="profile-mode-grid">
        <div class="profile-mode-row"><b>🪞 X Mirror</b><span><a href="mirror.html?tier=fun" class="mini-mode fun">FREE</a><a href="mirror.html?tier=real" class="mini-mode real">REAL · 5⚡</a></span></div>
        <div class="profile-mode-row"><b>👀 X Stalk</b><span><a href="stalk.html?tier=fun" class="mini-mode fun">FREE</a><a href="stalk.html?tier=real" class="mini-mode real">REAL · 5⚡</a></span></div>
        <div class="profile-mode-row"><b>💞 X Match</b><span><a href="match.html?tier=fun" class="mini-mode fun">FREE</a><a href="match.html?tier=real" class="mini-mode real">REAL · 10⚡</a></span></div>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2 data-i18n="profile_history">Geçmiş Analizler</h2>
        <button type="button" class="btn btn-sm btn-ghost" id="selectModeBtn" data-i18n="history_select">Seç</button>
      </div>
      <div id="historyBox"></div>
      <div id="selectActions" hidden>
        <button type="button" class="btn btn-sm btn-orange" id="deleteSelectedBtn" data-i18n="history_delete">Seçilenleri Temizle</button>
        <button type="button" class="btn btn-sm btn-ghost" id="cancelSelectBtn" data-i18n="history_cancel">İptal</button>
      </div>
    </div>

    <button type="button" class="btn btn-ghost" id="logoutBtn" data-i18n="profile_logout">Çıkış Yap</button>
  </section>

</main>

<footer class="foot">XORA V2</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="xora.js"></script>
<script src="card.js"></script>
<script>
(async function () {
  try {
  await initSession();
  } catch (e) { console.error("[XORA profile] initSession error", e); }
  if (!isLoggedIn()) {
    window.location.href = "auth.html";
    return;
  }

  function typeLabel(type, result) {
    var tier = resultTier(result).toUpperCase();
    var tierClass = tier === "REAL" ? " tier-real" : " tier-fun";
    if (type === "mirror") return '<span class="history-type">🪞 Mirror</span><span class="history-tier' + tierClass + '">' + tier + '</span>';
    if (type === "stalk")  return '<span class="history-type h-stalk">👀 Stalk</span><span class="history-tier' + tierClass + '">' + tier + '</span>';
    return '<span class="history-type h-match">💞 Match</span><span class="history-tier' + tierClass + '">' + tier + '</span>';
  }

  function fmtDate(ts) {
    var d = new Date(ts);
    var today = new Date();
    if (d.toDateString() === today.toDateString()) return t("date_today");
    return d.toLocaleDateString(getLang() === "tr" ? "tr-TR" : getLang() === "es" ? "es-ES" : getLang() === "pt" ? "pt-BR" : getLang() === "ar" ? "ar-u-nu-latn" : getLang() === "fr" ? "fr-FR" : "en-US",
                                { day: "numeric", month: "short" });
  }

  var remoteAnalyses = [];
  var selectMode = false;
  var selectedIds = {};

  function normalizeRemoteAnalysis(a) {
    var res = a.result || a.raw_result || {};
    var type = a.analysis_type || a.type;
    var handles = a.handles || (a.target_username ? [a.target_username].concat(a.target_username_2 ? [a.target_username_2] : []) : []);
    if (!handles.length && res.handles) handles = res.handles;
    var title = a.title || a.result_title;
    if (!title && res.meta && /^mirror_v/.test(res.meta.version || "")) title = "@" + (res.handle || (handles[0]) || "?");
    if (!title && res.card && res.card.nickname) title = res.card.nickname[getLang()];
    if (!title && res.archetype && res.archetype.name) title = res.archetype.name[getLang()];
    var isRemote = !!a.user_id;
    return {
      localId: isRemote ? null : a.id,
      remoteId: isRemote ? a.id : (a.remote_id || null),
      type: type,
      handles: handles,
      ts: a.created_at || a.createdAt,
      resultTitle: title,
      rawResult: res
    };
  }

  function showCardModal(item) {
    var existing = document.getElementById("cardModal");
    if (existing) existing.remove();

    var modal = document.createElement("div");
    modal.id = "cardModal";
    modal.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto";
    var inner = document.createElement("div");
    inner.style.cssText = "background:var(--bg,#1a1a2e);border-radius:1.2rem;padding:1.5rem;max-width:420px;width:100%;position:relative";

    try {
      if (item.rawResult && item.type === "match") {
        inner.innerHTML = buildMatchCard(item.rawResult);
      } else if (item.rawResult) {
        inner.innerHTML = buildIdentityCard(item.rawResult);
      }
    } catch (e) { inner.innerHTML = "<p>" + esc(t("card_load_failed")) + "</p>"; }

    var closeBtn = document.createElement("button");
    closeBtn.textContent = t("close");
    closeBtn.className = "btn btn-ghost";
    closeBtn.style.cssText = "margin-top:1rem;width:100%";
    closeBtn.onclick = function () { modal.remove(); };
    inner.appendChild(closeBtn);
    modal.appendChild(inner);
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  function renderHistoryList(hist) {
    var box = document.getElementById("historyBox");
    var selectBtn = document.getElementById("selectModeBtn");
    var actionsDiv = document.getElementById("selectActions");

    if (hist.length === 0) {
      box.innerHTML = '<div class="empty-box">' +
                        "<p>" + esc(t("profile_empty")) + "</p>" +
                        '<p><a href="mirror.html">' + esc(t("profile_empty_sub")) + "</a></p>" +
                      "</div>";
      selectBtn.hidden = true;
      actionsDiv.hidden = true;
      return;
    }

    selectBtn.hidden = false;
    selectBtn.textContent = selectMode ? esc(t("history_cancel")) : esc(t("history_select"));
    if (selectMode) {
      actionsDiv.hidden = false;
      actionsDiv.style.cssText = "display:flex;gap:8px;margin-top:12px";
    } else {
      actionsDiv.hidden = true;
      actionsDiv.removeAttribute("style");
    }

    var html = "";
    for (var i = 0; i < hist.length; i++) {
      var hh = hist[i];
      var itemId = hh.remoteId ? ("r_" + hh.remoteId) : (hh.localId ? ("l_" + hh.localId) : ("idx_" + i));
      var main;
      if (hh.resultTitle) {
        var target = hh.handles[0] ? "@" + esc(hh.handles[0]) : "";
        var second = hh.handles[1] ? " × @" + esc(hh.handles[1]) : "";
        main = "<bdi>" + target + second + "</bdi> — " + esc(hh.resultTitle);
      } else if (hh.type === "match" && hh.handles[0] && hh.handles[1]) {
        main = "<bdi>@" + esc(hh.handles[0]) + " × @" + esc(hh.handles[1]) + "</bdi>";
      } else if (hh.handles[0]) {
        main = "<bdi>@" + esc(hh.handles[0]) + "</bdi>";
      } else {
        main = esc(hh.type);
      }

      if (selectMode) {
        var checked = selectedIds[itemId] ? " checked" : "";
        html += '<div class="history-item" style="cursor:pointer" data-sel-id="' + esc(String(itemId)) + '">' +
                  '<input type="checkbox" class="history-check" data-sel-id="' + esc(String(itemId)) + '"' + checked + ' style="accent-color:var(--orange);width:18px;height:18px;margin-right:8px;flex-shrink:0">' +
                  typeLabel(hh.type, hh.rawResult) +
                  '<span class="history-main">' + main + "</span>" +
                  '<span class="history-date">' + fmtDate(hh.ts) + "</span>" +
                "</div>";
      } else {
        html += '<div class="history-item">' +
                  typeLabel(hh.type, hh.rawResult) +
                  '<span class="history-main">' + main + "</span>" +
                  '<span class="history-date">' + fmtDate(hh.ts) + "</span>" +
                  (hh.rawResult ? '<button class="btn btn-sm btn-ghost history-view-btn" data-idx="' + i + '">' + esc(t("view_card")) + "</button>" : "") +
                "</div>";
      }
    }
    box.innerHTML = html;

    if (selectMode) {
      var checks = box.querySelectorAll(".history-check");
      for (var c = 0; c < checks.length; c++) {
        checks[c].addEventListener("change", function () {
          var sid = this.getAttribute("data-sel-id");
          if (this.checked) selectedIds[sid] = true;
          else delete selectedIds[sid];
        });
      }
      var rows = box.querySelectorAll("[data-sel-id]");
      for (var r = 0; r < rows.length; r++) {
        if (rows[r].tagName === "INPUT") continue;
        rows[r].addEventListener("click", function (e) {
          if (e.target.tagName === "INPUT") return;
          var cb = this.querySelector(".history-check");
          if (cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event("change")); }
        });
      }
    } else {
      var buttons = box.querySelectorAll(".history-view-btn");
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].addEventListener("click", (function (idx) {
          return function () { showCardModal(hist[idx]); };
        })(parseInt(buttons[j].getAttribute("data-idx"), 10)));
      }
    }
  }

  function render() {
    try {
    var profile = getCurrentUser();
    var user = getUser();
    document.getElementById("noUser").hidden = !!profile;
    document.getElementById("hasUser").hidden = !profile;
    if (!profile) { applyI18n(); return; }

    document.getElementById("pName").textContent = (profile && profile.display_name) || ("@" + user);
    document.getElementById("pHandle").textContent = "@" + user;
    document.getElementById("pCredits").textContent = profile && profile.credit_balance != null ? profile.credit_balance : getCredits();
    var avatar = document.getElementById("pAvatar");
    avatar.hidden = !(profile && profile.avatar_url);
    if (profile && profile.avatar_url) avatar.src = profile.avatar_url;

    var hist = [];
    try {
      var raw = remoteAnalyses.length > 0 ? remoteAnalyses : getHistory();
      var hiddenSet = {};
      var hiddenList = getHiddenAnalyses();
      for (var hi = 0; hi < hiddenList.length; hi++) hiddenSet[hiddenList[hi]] = true;
      for (var ri = 0; ri < raw.length; ri++) {
        var isRemote = !!raw[ri].user_id;
        if (isRemote && hiddenSet[raw[ri].id]) continue;
        hist.push(normalizeRemoteAnalysis(raw[ri]));
      }
    } catch (e) { console.error("[XORA profile] history parse error", e); }

    var holder = document.getElementById("lastCardHolder");

    // 1) currentUser.last_card
    var lastCard = profile.last_card || null;
    console.log("[XORA profile] last_card from currentUser", lastCard ? "found" : "null");

    // 2) fallback: localStorage analyses
    if (!lastCard || !lastCard.result) {
      var localMirror = getLastMirrorAnalysis();
      if (localMirror && localMirror.result) {
        lastCard = localMirror;
        console.log("[XORA profile] last_card from localStorage", lastCard.id);
      }
    }

    // 3) fallback: remote analyses
    if (!lastCard || !lastCard.result) {
      for (var mi = 0; mi < hist.length; mi++) {
        if (hist[mi].type === "mirror" && hist[mi].rawResult && hist[mi].rawResult.handle) {
          lastCard = { result: hist[mi].rawResult, createdAt: hist[mi].ts, type: "mirror" };
          console.log("[XORA profile] last_card from remote analyses");
          break;
        }
      }
    }

    var cardExpired = false;

    if (lastCard && lastCard.result && lastCard.result.handle) {
      try { holder.innerHTML = buildIdentityCard(lastCard.result); } catch (e) { console.error("[XORA profile] card render error", e); }
    } else {
      holder.innerHTML = '<div class="empty-box">' +
                         "<p>" + esc(t("profile_empty")) + "</p>" +
                         '<p><a href="mirror.html?tier=fun">' + esc(t("profile_empty_sub")) + "</a></p>" +
                       "</div>";
    }

    try { renderHistoryList(hist); } catch (e) { console.error("[XORA profile] history render error", e); }

    applyI18n();
    } catch (e) {
      console.error("[XORA profile] render error", e);
      document.getElementById("hasUser").hidden = false;
      document.getElementById("noUser").hidden = true;
    }
  }

  document.getElementById("selectModeBtn").addEventListener("click", function () {
    selectMode = !selectMode;
    selectedIds = {};
    render();
  });

  document.getElementById("cancelSelectBtn").addEventListener("click", function () {
    selectMode = false;
    selectedIds = {};
    render();
  });

  document.getElementById("deleteSelectedBtn").addEventListener("click", function () {
    var keys = Object.keys(selectedIds);
    if (keys.length === 0) {
      toast(t("history_none_selected"));
      return;
    }

    var localIds = [];
    var remoteIds = [];
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k];
      if (key.indexOf("r_") === 0) {
        remoteIds.push(parseInt(key.substring(2), 10));
      } else if (key.indexOf("l_") === 0) {
        localIds.push(key.substring(2));
      }
    }

    console.log("[XORA delete] selected", { selectedKeys: keys, localIds: localIds, remoteIds: remoteIds });

    if (localIds.length > 0) {
      var localResult = deleteAnalysesLocal(localIds);
      console.log("[XORA delete] local result", localResult);
    }

    if (remoteIds.length > 0) {
      hideRemoteAnalyses(remoteIds);
      console.log("[XORA delete] hidden remote ids", remoteIds);
    }

    selectMode = false;
    selectedIds = {};
    render();

    toast(t("history_deleted"));
  });

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    if (confirm(t("logout_confirm"))) {
      await clearSession();
      toast(t("logout_done"));
      setTimeout(function () { window.location.href = "auth.html"; }, 900);
    }
  });
  var loginBtn = document.getElementById("profileLoginBtn");
  if (loginBtn) loginBtn.href = "auth.html";

  async function loadRemoteAnalyses() {
    remoteAnalyses = await getRemoteAnalyses(30);
    render();
  }

  document.addEventListener("xora:lang", render);
  document.addEventListener("xora:session", loadRemoteAnalyses);
  document.addEventListener("DOMContentLoaded", loadRemoteAnalyses);
  render();
})();
</script>

</body>
</html>
