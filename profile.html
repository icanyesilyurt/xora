<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
  <nav class="topnav">
    <a href="credits.html" class="pill credits-pill">⚡ <b id="creditVal">10</b></a>
    <a href="profile.html" class="pill" data-i18n="nav_profile">Profil</a>
    <button type="button" class="pill lang-btn" id="langBtn">EN</button>
  </nav>
</header>

<main class="page">
  <h1 data-i18n="profile_h1">Profil</h1>
  <p class="sub"></p>

  <!-- bağlı kullanıcı yoksa -->
  <section id="noUser" hidden>
    <div class="empty-box">
      <p data-i18n="profile_nouser">Devam etmek için giriş yapmalısın.</p>
      <a href="auth.html" class="btn" id="profileLoginBtn" data-i18n="profile_gomirror">Giriş Yap</a>
    </div>
  </section>

  <!-- bağlı kullanıcı varsa -->
  <section id="hasUser" hidden>

    <div class="panel">
      <div class="profile-row">
        <div class="profile-user">
          <img id="pAvatar" class="profile-avatar" alt="">
          <div>
          <p class="profile-name" id="pName">@kullanici</p>
          <p class="history-date" id="pHandle">@kullanici</p>
          <p class="history-date" data-i18n="profile_balance">Merak Kredisi</p>
          </div>
        </div>
        <p class="balance-big"><span id="pCredits">0</span> <small>⚡</small></p>
      </div>
    </div>

    <div class="panel" id="lastCardPanel">
      <h2 data-i18n="profile_last">Son Kartın</h2>
      <div id="lastCardHolder" style="text-align:center"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="profile_actions">Analiz Başlat</h2>
      <div class="result-actions">
        <a href="mirror.html" class="btn btn-sm">X Mirror</a>
        <a href="stalk.html" class="btn btn-sm btn-orange">X Stalk</a>
        <a href="match.html" class="btn btn-sm btn-ghost">X Match</a>
      </div>
    </div>

    <div class="panel">
      <h2 data-i18n="profile_history">Geçmiş Analizler</h2>
      <div id="historyBox"></div>
    </div>

    <button type="button" class="btn btn-ghost" id="logoutBtn" data-i18n="profile_logout">Çıkış Yap</button>
  </section>

</main>

<footer class="foot">XORA V1</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="xora.js"></script>
<script src="card.js"></script>
<script>
(async function () {
  try {
  await initSession();
  } catch (e) { console.error("[XORA profile] initSession error", e); }
  if (!isLoggedIn()) {
    window.location.href = "auth.html";
    return;
  }

  function typeLabel(type) {
    if (type === "mirror") return '<span class="history-type">🪞 Mirror</span>';
    if (type === "stalk")  return '<span class="history-type h-stalk">👀 Stalk</span>';
    return '<span class="history-type h-match">💞 Match</span>';
  }

  function fmtDate(ts) {
    var d = new Date(ts);
    var today = new Date();
    if (d.toDateString() === today.toDateString()) return t("date_today");
    return d.toLocaleDateString(getLang() === "tr" ? "tr-TR" : "en-US",
                                { day: "numeric", month: "short" });
  }

  var remoteAnalyses = [];

  function normalizeRemoteAnalysis(a) {
    var res = a.result || {};
    var type = a.analysis_type || a.type;
    var handles = a.handles || [];
    if (!handles.length && res.handles) handles = res.handles;
    var title = a.title;
    if (!title && res.archetype && res.archetype.name) title = res.archetype.name[getLang()];
    return {
      type: type,
      handles: handles,
      ts: a.created_at || a.createdAt,
      resultTitle: title,
      rawResult: res
    };
  }

  function showCardModal(item) {
    var existing = document.getElementById("cardModal");
    if (existing) existing.remove();

    var modal = document.createElement("div");
    modal.id = "cardModal";
    modal.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto";
    var inner = document.createElement("div");
    inner.style.cssText = "background:var(--bg,#1a1a2e);border-radius:1.2rem;padding:1.5rem;max-width:420px;width:100%;position:relative";

    try {
      if (item.rawResult && item.type === "match") {
        inner.innerHTML = buildMatchCard(item.rawResult);
      } else if (item.rawResult) {
        inner.innerHTML = buildIdentityCard(item.rawResult);
      }
    } catch (e) { inner.innerHTML = "<p>Kart yüklenemedi</p>"; }

    var closeBtn = document.createElement("button");
    closeBtn.textContent = t("close");
    closeBtn.className = "btn btn-ghost";
    closeBtn.style.cssText = "margin-top:1rem;width:100%";
    closeBtn.onclick = function () { modal.remove(); };
    inner.appendChild(closeBtn);
    modal.appendChild(inner);
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  function renderHistoryList(hist) {
    var box = document.getElementById("historyBox");
    if (hist.length === 0) {
      box.innerHTML = '<div class="empty-box">' +
                        "<p>" + esc(t("profile_empty")) + "</p>" +
                        '<p><a href="mirror.html">' + esc(t("profile_empty_sub")) + "</a></p>" +
                      "</div>";
      return;
    }

    var html = "";
    for (var i = 0; i < hist.length; i++) {
      var hh = hist[i];
      var main;
      if (hh.resultTitle) {
        var target = hh.handles[0] ? "@" + esc(hh.handles[0]) : "";
        var second = hh.handles[1] ? " × @" + esc(hh.handles[1]) : "";
        main = target + second + " — " + esc(hh.resultTitle);
      } else if (hh.type === "match" && hh.handles[0] && hh.handles[1]) {
        main = "@" + esc(hh.handles[0]) + " × @" + esc(hh.handles[1]);
      } else if (hh.handles[0]) {
        main = "@" + esc(hh.handles[0]);
      } else {
        main = esc(hh.type);
      }
      html += '<div class="history-item">' +
                typeLabel(hh.type) +
                '<span class="history-main">' + main + "</span>" +
                '<span class="history-date">' + fmtDate(hh.ts) + "</span>" +
                (hh.rawResult ? '<button class="btn btn-sm btn-ghost history-view-btn" data-idx="' + i + '">' + esc(t("view_card")) + "</button>" : "") +
              "</div>";
    }
    box.innerHTML = html;

    var buttons = box.querySelectorAll(".history-view-btn");
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener("click", (function (idx) {
        return function () { showCardModal(hist[idx]); };
      })(parseInt(buttons[j].getAttribute("data-idx"), 10)));
    }
  }

  function render() {
    try {
    var profile = getCurrentUser();
    var user = getUser();
    document.getElementById("noUser").hidden = !!profile;
    document.getElementById("hasUser").hidden = !profile;
    if (!profile) { applyI18n(); return; }

    document.getElementById("pName").textContent = (profile && profile.display_name) || ("@" + user);
    document.getElementById("pHandle").textContent = "@" + user;
    document.getElementById("pCredits").textContent = profile && profile.credit_balance != null ? profile.credit_balance : getCredits();
    var avatar = document.getElementById("pAvatar");
    avatar.hidden = !(profile && profile.avatar_url);
    if (profile && profile.avatar_url) avatar.src = profile.avatar_url;

    var hist = [];
    try {
      hist = remoteAnalyses.length > 0 ? remoteAnalyses.map(normalizeRemoteAnalysis) : getHistory().map(normalizeRemoteAnalysis);
    } catch (e) { console.error("[XORA profile] history parse error", e); }

    var holder = document.getElementById("lastCardHolder");
    var lastMirror = null;
    for (var i = 0; i < hist.length; i++) {
      if (hist[i].type === "mirror" && hist[i].rawResult) { lastMirror = hist[i]; break; }
    }

    if (lastMirror) {
      try {
        holder.innerHTML = buildIdentityCard(lastMirror.rawResult);
      } catch (e) { console.error("[XORA profile] card render error", e); }
    } else {
      holder.innerHTML = '<div class="empty-box">' +
                           "<p>" + esc(t("profile_empty")) + "</p>" +
                           '<p><a href="mirror.html">' + esc(t("profile_empty_sub")) + "</a></p>" +
                         "</div>";
    }

    try { renderHistoryList(hist); } catch (e) { console.error("[XORA profile] history render error", e); }

    applyI18n();
    } catch (e) {
      console.error("[XORA profile] render error", e);
      document.getElementById("hasUser").hidden = false;
      document.getElementById("noUser").hidden = true;
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    if (confirm(t("logout_confirm"))) {
      await clearSession();
      toast(t("logout_done"));
      setTimeout(function () { window.location.href = "auth.html"; }, 900);
    }
  });
  var loginBtn = document.getElementById("profileLoginBtn");
  if (loginBtn) loginBtn.href = "auth.html";

  async function loadRemoteAnalyses() {
    remoteAnalyses = await getRemoteAnalyses(30);
    render();
  }

  document.addEventListener("xora:lang", render);
  document.addEventListener("xora:session", loadRemoteAnalyses);
  document.addEventListener("DOMContentLoaded", loadRemoteAnalyses);
  render();
})();
</script>

</body>
</html>
