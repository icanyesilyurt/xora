<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merak Kredisi — XORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="logo">XO<span>RA</span></a>
  <nav class="topnav">
    <a href="credits.html" class="pill credits-pill">⚡ <b id="creditVal">10</b></a>
    <a href="profile.html" class="pill" data-i18n="nav_profile">Profil</a>
    <button type="button" class="pill lang-btn" id="langBtn">EN</button>
  </nav>
</header>

<main class="page">
  <span class="mode-emoji">⚡</span>
  <h1 data-i18n="credits_h1">Merak Kredisi</h1>
  <p class="sub" data-i18n="credits_sub">Fun bedava. Real analiz, X verisini gerçekten okuduğu için kredi kullanır.</p>

  <div class="panel">
    <div class="profile-row">
      <p style="font-weight:800" data-i18n="credits_balance">Bakiyen</p>
      <p class="balance-big"><span id="balanceVal">0</span> <small>⚡</small></p>
    </div>
  </div>

  <p class="launch-offer" id="launchOffer"></p>
  <div class="packs" id="creditPacks"></div>

  <p class="demo-note" data-i18n="credits_note">Ödeme iyzico ile bağlanacak. Bu sürümde satın alma butonları test amaçlı pasiftir.</p>
</main>

<footer class="foot">XORA V2</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  function renderBalance() {
    document.getElementById("balanceVal").textContent = getCredits();
  }

  var packs = document.getElementById("creditPacks");
  var banner = document.getElementById("launchOffer");
  function renderPacks() { renderCreditPackages(packs, banner); }

  packs.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest("[data-amount]") : null;
    if (!btn) return;
    var n = parseInt(btn.getAttribute("data-amount"), 10);
    toast(t("payment_soon") + " (" + n + "⚡)");
  });

  document.addEventListener("DOMContentLoaded", renderBalance);
  document.addEventListener("xora:lang", renderPacks);
  renderPacks();
  renderBalance();
})();
</script>

</body>
</html>
